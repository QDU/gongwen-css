name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment registered as the npm Trusted Publisher.
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish
      # npm processes uploads asynchronously; purging before the version is
      # visible would re-cache the previous release under the aliases.
      - name: Wait for the version to appear on npm
        run: |
          version=$(node -p 'require("./package.json").version')
          for i in $(seq 1 40); do
            [ "$(npm view "@qdu/gongwen-css@latest" version --prefer-online 2>/dev/null)" = "$version" ] && exit 0
            sleep 15
          done
          echo "::warning::@qdu/gongwen-css@$version not visible as latest after 10 minutes"
      - name: Refresh jsDelivr version aliases
        run: |
          for v in latest "$(node -p 'require("./package.json").version.split(".")[0]')"; do
            curl -fsS "https://purge.jsdelivr.net/npm/@qdu/gongwen-css@$v/dist/gongwen.css" > /dev/null || echo "::warning::jsDelivr purge failed for @$v"
          done
